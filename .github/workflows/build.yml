name: build

# Builds the sandbox image Hermes' Docker terminal backend runs the agent's
# commands in. Pull requests only build (to catch a broken Dockerfile); pushes
# to main also publish to the GitHub container registry.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/jeroenluchtenberg/hermes-sandbox

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # VERSION is the source of truth for the tag, so the Ansible side
      # (hermes_sandbox_tag) and this workflow cannot disagree.
      - name: Read the pinned version
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          docker build \
            -t "$IMAGE:${{ steps.version.outputs.value }}" \
            -t "$IMAGE:latest" .

      - name: Publish
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${{ steps.version.outputs.value }}"
          docker push "$IMAGE:latest"
